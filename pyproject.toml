[project]
name = "darknet-scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kirill Kruglikov", email = "kirillkruglikov@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "brotli>=1.2.0",
    "httpx2>=2.12.0",
    "pandas>=3.0.5",
    "pycryptodome>=3.20.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "socksio>=1.0.0",
    "stem>=1.8.2",
    "tqdm>=4.70.1",
]

[project.scripts]
darknet-scraper = "darknet_scraper:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
