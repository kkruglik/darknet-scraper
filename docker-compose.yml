services:
  scraper:
    build: .
    restart: on-failure
    # Docker keeps everything printed to the console (tqdm bars, warnings)
    # in one JSON file that never rotates by default, growing forever.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./logs:/app/logs
