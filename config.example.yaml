scrape_shops:
  start_url: "https://example-mirror.onion"
  cache_dir: data/cache/shops
  output_file: data/results/shops/shops.csv

scrape_reviews:
  input_file: data/results/shops/shops.csv
  cache_dir: data/cache/reviews
  output_dir: data/results/reviews

scrape_products:
  input_file: data/results/shops/shops.csv
  cache_dir: data/cache/products
  output_dir: data/results/products

auth:
  captcha_key: "your-2captcha-api-key"
  captcha_url: "http://example-captcha-mirror.onion/"
  max_captcha_retries: 20
  # One worker thread per account; each scrapes its own share of the shops.
  accounts:
    - login: "login-1"
      password: "password-1"
    - login: "login-2"
      password: "password-2"
